<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}"/>

</head>
<body>
    <h1>Uno mit Zuschauern</h1>
    <h2>Season 1</h2>
    <h3>Stand nach Runde {{ total_wins }}</h3>
    <a href="{{url_for('auth.login')}}">Login</a>
    <nav>

    </nav>
    <br>
    <table class="ranking-table">
        <thead>
            <tr>
                <th class="platz">Platz</th>
                <th class="player">Spieler</th>
                <th class="wins">Wins</th>
                <th class="anteil">Anteil</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td class="platz">{{ loop.index }}.</td>
                <td class="player">{{ player.name}}</td>
                <td class="wins">{{ player.wins}}</td>
                <td class="anteil">{{ ((player.wins / (players | map(attribute="wins") | sum )) * 100) | round(2) }}%</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
    setTimeout(function() {
        location.reload();
    }, 10 * 60 * 1000);
    </script>

</body>
</html>
